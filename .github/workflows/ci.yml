# The same checks CONTRIBUTING.md documents, so a contributor can run them locally
# and get the same answer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `--all-targets` so tests and benches are linted too: they are the code most
      # likely to carry an `unwrap` nobody reviews.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The installers are the two files in this repository that run on a user's machine
      # before they have anything else, and neither is compiled or tested by anything else
      # here. `shellcheck -s sh` forces the POSIX dialect: install.sh is piped into an
      # interpreter whose flags the user has not read, so a bash-ism in it is a bug.
      - name: shellcheck the installers
        run: |
          shellcheck -s sh install.sh
          shellcheck scripts/package.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in Cargo.toml. `resolver = "3"` is MSRV-aware, so a
      # dependency that quietly raises its own floor fails here rather than in a
      # user's build.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  deps:
    name: dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Count the default build's transitive crates
        run: |
          set -euo pipefail
          cargo tree --workspace -e normal --prefix none \
            | grep -E ' v[0-9]' | sed -E 's/ \(\*\)$//' | sort -u > /tmp/crates.txt
          count=$(wc -l < /tmp/crates.txt)
          echo "transitive crates in the default build: $count (budget 60)"
          if [ "$count" -gt 60 ]; then
            echo "::error::dependency budget exceeded: $count > 60. See plans/001-local-v1-core.md Appendix B."
            cat /tmp/crates.txt
            exit 1
          fi
      - name: cargo-deny (licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  bench:
    # The plan's §7 budget, enforced rather than asserted. It runs on Linux and on one
    # runner, because the gates are absolute numbers and absolute numbers are a property of
    # a machine: on Windows the process spawn alone costs 9 ms, which would fail `open ≤ 5 ms`
    # before any code ran.
    #
    # `--runs 200` is the sample count that makes a 95th percentile a tail statistic rather
    # than a coin flip. At fifty samples the percentile is the 48th, so one interruption from
    # whatever else is on the runner decides the gate; at two hundred there are ten samples
    # of slack. See the plan for the measurement that settled it.
    name: performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Measure, and fail if the budget is missed
        run: |
          set -o pipefail
          ./target/release/kiomon bench --sizes 1000,10000 --runs 200 --repeat 1 --gate --json \
            | tee bench.json
      - name: Publish the numbers as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
          if-no-files-found: error
      - name: Put the numbers in the log, where a regression is visible in a diff
        if: always()
        run: |
          [ -f bench.json ] || exit 0
          python3 - <<'EOF'
          import json
          with open("bench.json", encoding="utf-8") as handle:
              data = json.load(handle)["data"]
          for report in data["reports"]:
              corpus = report["corpus"]
              print(f"\n{corpus['size']} memories, {corpus['disk_bytes'] / 1048576:.1f} MiB")
              for row in report["rows"]:
                  print(f"  {row['label']:<24} work p50 {row['work_p50_ms']:7.2f} ms  "
                        f"p95 {row['work_p95_ms']:7.2f} ms  matched {row['matches']}")
              for gate in report["gates"]:
                  print(f"  {'PASS' if gate['passed'] else 'FAIL'} {gate['label']} "
                        f"{gate['percentile']} <= {gate['limit_ms']} ms")
          EOF

  audit:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Four targets, four native runners — no cross-compilation, so a green job is a
    # binary that actually linked. `ubuntu-24.04-arm` is GitHub's public-repository
    # ARM runner; if this repository ever goes private, swap that lane for `cross`
    # rather than deleting it.
    name: build (${{ matrix.target }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Report the binary size against the 6 MB budget
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/kiomon
          [ -f "$bin" ] || bin="$bin.exe"
          bytes=$(wc -c < "$bin")
          echo "${{ matrix.target }}: $((bytes / 1024)) KiB (budget 6144 KiB)"
          if [ "$bytes" -gt 6291456 ]; then
            echo "::error::binary-size budget exceeded: $((bytes / 1024)) KiB > 6144 KiB"
            exit 1
          fi
      - name: Smoke test that the binary runs
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/kiomon
          [ -f "$bin" ] || bin="$bin.exe"
          "$bin" --version
          "$bin" --help > /dev/null
