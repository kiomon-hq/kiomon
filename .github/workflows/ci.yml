# The same checks CONTRIBUTING.md documents, so a contributor can run them locally
# and get the same answer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `--all-targets` so tests and benches are linted too: they are the code most
      # likely to carry an `unwrap` nobody reviews.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The installers are the two files in this repository that run on a user's machine
      # before they have anything else, and neither is compiled or tested by anything else
      # here. `shellcheck -s sh` forces the POSIX dialect: install.sh is piped into an
      # interpreter whose flags the user has not read, so a bash-ism in it is a bug.
      - name: shellcheck the installers
        run: |
          shellcheck -s sh install.sh
          shellcheck scripts/package.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in Cargo.toml. `resolver = "3"` is MSRV-aware, so a
      # dependency that quietly raises its own floor fails here rather than in a
      # user's build. 1.88 is where `if a && let Some(b) = c` became stable, and the code
      # uses it twice; the first CI run of this repository caught the claim of 1.85.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  deps:
    name: dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Count the default build's transitive crates
        run: |
          set -euo pipefail
          cargo tree --workspace -e normal --prefix none \
            | grep -E ' v[0-9]' | sed -E 's/ \(\*\)$//' | sort -u > /tmp/crates.txt
          count=$(wc -l < /tmp/crates.txt)
          echo "transitive crates in the default build: $count (budget 60)"
          if [ "$count" -gt 60 ]; then
            echo "::error::dependency budget exceeded: $count > 60. See plans/001-local-v1-core.md Appendix B."
            cat /tmp/crates.txt
            exit 1
          fi
      - name: cargo-deny (licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  bench:
    # The plan's §7 budget, enforced rather than asserted. It runs on Linux and on one
    # runner, because the gates are absolute numbers and absolute numbers are a property of
    # a machine: on Windows the process spawn alone costs 9 ms, which would fail `open ≤ 5 ms`
    # before any code ran.
    #
    # `--runs 200` is the sample count that makes a 95th percentile a tail statistic rather
    # than a coin flip. At fifty samples the percentile is the 48th, so one interruption from
    # whatever else is on the runner decides the gate; at two hundred there are ten samples
    # of slack. See the plan for the measurement that settled it.
    name: performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Measure, and fail if the budget is missed
        # A gate that fails twice is a regression; a gate that fails once on a shared runner
        # is the runner. The evidence is this repository's own CI: the same commit measured
        # `common (fts)` at 4.05 ms p95 and then 86.69 ms p95, with `open` and `add` unmoved
        # in both runs -- a tail that only the rows touching more pages picked up, which is
        # the disk, not the code.
        #
        # So the gate runs once, and runs again only if it fails. Nothing is measured
        # differently and no limit is relaxed: a real regression fails both passes, and a
        # stall that cannot repeat itself fails nothing. The retry writes its own artifact,
        # so a reader can see which one decided.
        run: |
          set -o pipefail
          bench() { ./target/release/kiomon bench --sizes 1000,10000 --runs 200 --repeat 1 --gate --json; }
          if bench | tee bench.json; then exit 0; fi
          echo "::warning::the budget was missed once; measuring again to tell a regression from a stalled runner"
          bench | tee bench-retry.json

      - name: Publish the numbers as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            bench.json
            bench-retry.json
          if-no-files-found: error
      - name: Put the numbers in the log, where a regression is visible in a diff
        if: always()
        run: |
          [ -f bench.json ] || [ -f bench-retry.json ] || exit 0
          python3 - <<'EOF'
          import json, os
          # The retry is the interesting one when it exists: the verdict rests on it.
          name = "bench-retry.json" if os.path.exists("bench-retry.json") else "bench.json"
          with open(name, encoding="utf-8") as handle:
              data = json.load(handle)["data"]
          for report in data["reports"]:
              corpus = report["corpus"]
              print(f"\n{corpus['size']} memories, {corpus['disk_bytes'] / 1048576:.1f} MiB")
              for row in report["rows"]:
                  print(f"  {row['label']:<24} work p50 {row['work_p50_ms']:7.2f} ms  "
                        f"p95 {row['work_p95_ms']:7.2f} ms  matched {row['matches']}")
              for gate in report["gates"]:
                  print(f"  {'PASS' if gate['passed'] else 'FAIL'} {gate['label']} "
                        f"{gate['percentile']} <= {gate['limit_ms']} ms")
          EOF

  examples:
    # The examples are documentation that can rot silently: a flag renamed, a route reshaped,
    # and the tour keeps "working" only in the reader's imagination. The two that need nothing
    # but the binary run here on every push. The SDK examples cannot — their clients live in
    # other repositories — which is what `scripts/sdk_conformance*.{py,mjs}` are for, run by
    # hand against a machine that has those checkouts.
    name: examples still run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: The CLI tour, end to end
        run: bash examples/cli-tour.sh
      - name: The HTTP door with curl
        run: bash examples/curl.sh

  audit:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Four targets, four native runners — no cross-compilation, so a green job is a
    # binary that actually linked. `ubuntu-24.04-arm` is GitHub's public-repository
    # ARM runner; if this repository ever goes private, swap that lane for `cross`
    # rather than deleting it.
    name: build (${{ matrix.target }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Report the binary size against the 6 MB budget
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/kiomon
          [ -f "$bin" ] || bin="$bin.exe"
          bytes=$(wc -c < "$bin")
          echo "${{ matrix.target }}: $((bytes / 1024)) KiB (budget 6144 KiB)"
          if [ "$bytes" -gt 6291456 ]; then
            echo "::error::binary-size budget exceeded: $((bytes / 1024)) KiB > 6144 KiB"
            exit 1
          fi
      - name: Smoke test that the binary runs
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/kiomon
          [ -f "$bin" ] || bin="$bin.exe"
          "$bin" --version
          "$bin" --help > /dev/null
