[package]
name = "kiomon-core"
description = "The storage, retrieval and lifecycle engine behind the kiomon CLI"
documentation = "https://docs.rs/kiomon-core"
readme = "README.md"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
thiserror.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `bundled` compiles SQLite into the binary: no system library, no version skew, and
# a `kiomon` binary that runs on a machine with nothing installed. The cost is build
# time and about 1.5 MB of binary, both of which are budgeted in the plan.
rusqlite = { version = "0.40", features = ["bundled"] }
# Only for ULID randomness. A hand-written ULID over a real CSPRNG is smaller than a
# ULID crate plus its `rand` tree, and the format is 40 lines with tests.
getrandom = "0.4"

# A bench target with no harness and no dependency: it prints its own table. See the top
# of `benches/store.rs` for why this is not Criterion, and `plans/001-local-v1-core.md`
# §8 WP3 for the measurement that decided it.
[[bench]]
name = "store"
harness = false

[lints]
workspace = true
