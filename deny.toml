# cargo-deny configuration. Appendix B of plans/001-local-v1-core.md.
#
# The default build's dependency budget is < 60 direct and transitive crates. That
# number is enforced by the `deps` job in CI, not by this file; this file enforces
# what may be *in* those crates.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
  # A local tool that links a system TLS stack is a local tool that fails to build
  # on someone else's machine. Anything that needs TLS uses rustls, and only on the
  # opt-in embedder path.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "native-tls-sys" },
  # Telemetry of any kind is out of scope for this project, permanently.
  { name = "sentry" },
  { name = "sentry-core" },
  { name = "opentelemetry" },
]

skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
